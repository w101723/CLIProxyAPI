name: docker-image

on:
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: read
  packages: write

env:
  APP_NAME: CLIProxyAPI
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/cliproxyapi

jobs:
  docker_amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Build Metadata
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags="latest sha-${short_sha}"
            version="main"
          else
            tags="${GITHUB_REF_NAME} sha-${short_sha}"
            version="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${version}" >> $GITHUB_ENV
          echo "COMMIT=${short_sha}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "IMAGE_TAGS=${tags}" >> $GITHUB_ENV
      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.VERSION }}-amd64
            ${{ env.IMAGE_REPO }}:sha-${{ env.COMMIT }}-amd64
            ${{ env.IMAGE_REPO }}:latest-amd64

  docker_arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Build Metadata
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags="latest sha-${short_sha}"
            version="main"
          else
            tags="${GITHUB_REF_NAME} sha-${short_sha}"
            version="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${version}" >> $GITHUB_ENV
          echo "COMMIT=${short_sha}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "IMAGE_TAGS=${tags}" >> $GITHUB_ENV
      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.VERSION }}-arm64
            ${{ env.IMAGE_REPO }}:sha-${{ env.COMMIT }}-arm64
            ${{ env.IMAGE_REPO }}:latest-arm64

  docker_manifest:
    runs-on: ubuntu-latest
    needs:
      - docker_amd64
      - docker_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Build Metadata
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags="latest sha-${short_sha}"
            version="main"
          else
            tags="${GITHUB_REF_NAME} sha-${short_sha}"
            version="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${version}" >> $GITHUB_ENV
          echo "COMMIT=${short_sha}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "IMAGE_TAGS=${tags}" >> $GITHUB_ENV
      - name: Create and push multi-arch manifests
        run: |
          for tag in ${IMAGE_TAGS}; do
            docker buildx imagetools create \
              --tag "${IMAGE_REPO}:${tag}" \
              "${IMAGE_REPO}:${tag}-amd64" \
              "${IMAGE_REPO}:${tag}-arm64"
          done


